name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  verify:
    name: Verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Tag matches the version in mygo.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')"
          if [ "$tagged" != "$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the version in mygo.json, $version"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.14.0
          install-only: true
      - name: Install govulncheck and gosec
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - name: make check
        run: make check
      - name: make test
        run: make test

  build:
    name: Build, sign and notarize
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Set up signing and notarization
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::the repository secret $name is not set"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials DisplayExt --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
      - name: Build, sign and notarize
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}"
      - name: Checksums
        working-directory: build/release
        run: shasum -a 256 DisplayExt-*.dmg > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release
          path: |
            build/release/DisplayExt-*.dmg
            build/release/SHA256SUMS
          if-no-files-found: error
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release
          path: artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          body: |
            Signed and notarized builds of DisplayExt ${{ steps.version.outputs.version }} for macOS 13 or later:

            - `DisplayExt-${{ steps.version.outputs.version }}-universal.dmg` runs on every Mac
            - `DisplayExt-${{ steps.version.outputs.version }}-arm64.dmg` for Apple silicon
            - `DisplayExt-${{ steps.version.outputs.version }}-x64.dmg` for Intel

            **Install**

            ```sh
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/DisplayExt-${{ steps.version.outputs.version }}-universal.dmg
            shasum -a 256 --check --ignore-missing SHA256SUMS
            open DisplayExt-${{ steps.version.outputs.version }}-universal.dmg
            ```

            Then drag DisplayExt to Applications.
          files: |
            artifacts/*.dmg
            artifacts/SHA256SUMS
