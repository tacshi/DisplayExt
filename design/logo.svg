<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FBFBFC"/>
      <stop offset="1" stop-color="#D3D7DD"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1F5"/>
      <stop offset="1" stop-color="#C5CDD8"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2D33" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2A2D33" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <rect x="538" y="386" width="336" height="266" rx="52" fill="#000000"/>
    </mask>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <g transform="translate(512 512) scale(0.74) translate(-512 -490)">
    <g filter="url(#shadow)">
      <g mask="url(#gap)">
        <rect x="170" y="282" width="500" height="330" rx="36" fill="#2A2D33"/>
        <rect x="196" y="308" width="448" height="278" rx="16" fill="url(#screen)"/>
        <path d="M390 612 L450 612 L466 676 L374 676 Z" fill="#2A2D33"/>
        <rect x="320" y="670" width="200" height="28" rx="14" fill="#2A2D33"/>
      </g>
    </g>

    <rect x="566" y="414" width="280" height="210" rx="30" fill="url(#ghost)"
          stroke="#2A2D33" stroke-width="22" stroke-dasharray="40 26" stroke-linecap="round"/>
  </g>
</svg>
